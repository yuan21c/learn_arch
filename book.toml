[book]
title = "Linux 与 Arch Linux 系统学习手册"
authors = ["yuan21c"]
description = "从命令、文件、权限，到进程、存储、网络，再到 Arch Linux 的包管理、systemd、构建与排障"
src = "src/"
language = "zh-CN"

[build]
build-dir = "book"
create-missing = false
use-default-preprocessors = true
extra-watch-dirs = []

[rust]
edition = "2021"

[output.html]
preferred-dark-theme = "ayu"
default-theme = "ayu"
mathjax-support = true
additional-css = ["custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor.mermaid]
